<style>
:root{--marine:#0B1F4B;--royal:#1F4FD8;--or:#D4A017;--ortxt:#8A6400;--acc:#1F4FD8;--bg:#F2F5FB;--card:#fff;--txt:#12204A;--mut:#56627F;--line:#DCE3F2;--tint:#E4ECFF;--head:#fff;--headtxt:#0B1F4B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081024;--card:#101B38;--txt:#EAF0FF;--mut:#9DA9C9;--line:#22305A;--tint:#1B2B5C;--head:#0D1733;--headtxt:#fff;--ortxt:#E8B93A;--acc:#86A8FF}}
:root[data-theme="dark"]{--bg:#081024;--card:#101B38;--txt:#EAF0FF;--mut:#9DA9C9;--line:#22305A;--tint:#1B2B5C;--head:#0D1733;--headtxt:#fff;--ortxt:#E8B93A;--acc:#86A8FF}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{background:var(--head);color:var(--headtxt);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:3px solid var(--or)}
header h1{margin:0;font:700 20px/1.1 Fraunces,Georgia,serif;color:var(--headtxt)}
header small{display:block;color:var(--ortxt);font-size:10.5px;font-weight:700;letter-spacing:.14em;margin-top:3px}
.bell{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--tint);font-size:19px}
main{flex:1;overflow-y:auto;padding:18px 16px 24px}
h2{font:700 25px/1.2 Fraunces,Georgia,serif;margin:0 0 14px}
h3{font:700 17px Fraunces,Georgia,serif;margin:26px 0 10px}
.hero{position:relative;overflow:hidden;background:var(--marine);color:#fff;border-radius:22px;padding:26px 22px 20px}
.hero b{display:block;font:700 27px/1.15 Fraunces,Georgia,serif}
.staff{position:relative;display:flex;height:45px;margin:26px 0 40px;background:repeating-linear-gradient(to bottom,rgba(212,160,23,.7) 0 1px,transparent 1px 11px)}
.staff span{position:relative;flex:1}
.staff span::before{content:"";position:absolute;left:calc(50% - 6px);top:calc(var(--y) - 6px);width:12px;height:12px;border-radius:50%;background:var(--or)}
.staff span::after{content:attr(data-w);position:absolute;top:56px;left:0;right:0;text-align:center;font-size:14px;font-weight:700;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--txt);font-size:15px;font-weight:700;text-align:left}
.sc i{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--tint);font-style:normal;font-size:22px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{border:1.5px solid var(--acc);background:none;color:var(--acc);border-radius:99px;padding:7px 16px;white-space:nowrap;font-weight:700}
.chip.on{background:var(--acc);color:var(--bg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.li{width:100%;text-align:left;color:var(--txt);background:none;border:0;border-bottom:1px solid var(--line);padding:15px 2px;font-size:16px}
.mut{color:var(--mut);font-size:14px}
.btn{background:var(--royal);color:#fff;border:0;border-radius:12px;padding:11px 18px;min-height:44px;font-weight:700}
.btn.alt{background:none;border:1px solid var(--line);color:var(--txt);font-weight:600}
.tag{background:var(--or);color:#2a1f00;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700}
.who{display:flex;align-items:center;gap:10px}
.av{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--marine);color:var(--or);border:2px solid var(--or);font:700 17px Fraunces,Georgia,serif}
.av.big{width:88px;height:88px;font-size:38px}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--txt);min-height:80px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px}
nav button{flex:1;background:none;border:0;padding:2px;color:var(--mut);font-size:11.5px;font-weight:600}
nav button i{display:grid;place-items:center;width:56px;height:30px;border-radius:99px;margin:0 auto 2px;font-style:normal;font-size:19px}
nav button.on{color:var(--acc);font-weight:700}
nav button.on i{background:var(--tint)}
.back{background:none;border:0;color:var(--acc);padding:0 0 12px;font-size:15px;font-weight:700}
.adm{display:flex;justify-content:space-between;align-items:center;background:var(--or);color:#2a1f00;font-weight:700;border-radius:12px;padding:8px 14px;margin-bottom:14px}
.adm .back{color:#2a1f00;text-decoration:underline}
.ov{position:fixed;inset:0;background:rgba(5,10,30,.6);display:grid;place-items:center;padding:20px;z-index:50}
.dlg{background:var(--card);color:var(--txt);border-radius:18px;padding:20px;width:100%;max-width:420px;max-height:90%;overflow-y:auto}
.dlg h3{margin-top:0}
.dlg label{display:block;font-size:14px;font-weight:700;margin:12px 0 4px}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--txt)}
.dlg .row{margin-top:16px}
.err{color:#D14B3A;margin:8px 0 0;font-size:14px;font-weight:700}
.pick{display:block;width:100%;position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 44px 12px 14px;margin-bottom:10px;color:var(--txt)}
.pick span{display:block;font-size:14px}
.pick.on{border-color:var(--acc);background:var(--tint)}
.pick.on::after{content:"✓";position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--acc);font-weight:700}
.fl{display:block;font-size:14px;font-weight:700;margin:14px 0 4px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.msg p{margin:6px 0 0;white-space:pre-wrap}
.msg.sys{background:var(--tint);text-align:center;font-weight:700}
.day{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 4px}
.who .mut{margin-left:4px}
#comp:empty{display:none}
#comp{background:var(--card);border-top:1px solid var(--line);padding:8px 12px}
#comp .row input{flex:1;min-width:0}
.att{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.att[hidden]{display:none}

.bw{display:flex;margin:6px 0}
.bw.me{justify-content:flex-end}
.bb{max-width:85%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.bb.md{width:min(85%,320px)}
.bw.me .bb{background:var(--tint);border-color:transparent}
.bn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--acc);margin-bottom:4px}
.bn .av{width:22px;height:22px;font-size:11px;border-width:1px}
.bb p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bt{text-align:right;font-size:11px;color:var(--mut);margin-top:3px}
.mm{display:block;max-width:100%;height:auto;border-radius:10px}
.loc{font-weight:700}

/* Palette du logo : indigo, bleu roi, azur, or */
:root{--nuit:#0A0F5C;--marine:#0C2484;--royal:#0C54CC;--azur:#0C84FC;--or:#FCB40C;--ortxt:#8F6300;--acc:#0C54CC;--bg:#EEF5FF;--card:#fff;--txt:#0A164F;--mut:#4A5B88;--line:#CFE0F7;--tint:#DCEBFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060A2E;--card:#0D1550;--txt:#EAF2FF;--mut:#A3B2DE;--line:#25348C;--tint:#16226E;--acc:#6DB2FF;--ortxt:#FCC73F}}
:root[data-theme="dark"]{--bg:#060A2E;--card:#0D1550;--txt:#EAF2FF;--mut:#A3B2DE;--line:#25348C;--tint:#16226E;--acc:#6DB2FF;--ortxt:#FCC73F}
header{background:linear-gradient(90deg,#0A0F5C,#0C2484 62%,#0C54CC);color:#fff}
header h1{color:#fff}
header small{color:var(--or)}
.bell{background:rgba(255,255,255,.16)}
h3{border-left:4px solid var(--or);padding-left:10px}
.hero{background:radial-gradient(circle at 88% 8%,rgba(12,156,252,.6),transparent 48%),linear-gradient(135deg,#0A0F5C,#0C2484 58%,#0C54CC);background-size:170% 170%,100% 100%;animation:glow 12s ease-in-out infinite alternate}
@keyframes glow{from{background-position:0% 0%,0 0}to{background-position:100% 100%,0 0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.fx>*{animation:rise .38s ease both}
main.fx>*:nth-child(2){animation-delay:.05s}main.fx>*:nth-child(3){animation-delay:.1s}main.fx>*:nth-child(4){animation-delay:.15s}main.fx>*:nth-child(5){animation-delay:.2s}main.fx>*:nth-child(n+6){animation-delay:.25s}
@media (prefers-reduced-motion:reduce){.hero,main.fx>*{animation:none}}
